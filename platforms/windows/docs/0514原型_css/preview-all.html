<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS实现版 - 全部页面预览</title>
    <link rel="stylesheet" href="./app.css" />
    <style>
      iframe{width:100%;height:100%;border:0;background:#fff}
      .frame-wrap{height: calc(100vh - 96px); min-height: 640px;}
      .split{display:grid;grid-template-columns: 340px 1fr;gap:12px;min-height:720px}
      .split .pane{border-right:none}
      .pages{display:grid;gap:10px;margin-top:14px}
      .pages button{width:100%;text-align:left}
      @media (max-width: 980px){ .split{grid-template-columns:1fr} .frame-wrap{height: 70vh} }
    </style>
  </head>
  <body>
    <div class="shell" style="grid-template-columns: 1fr;">
      <main class="main">
        <div class="topbar">
          <div>
            <div class="crumb">0514原型（CSS实现版）</div>
            <div class="page-title">全部页面预览</div>
          </div>
          <div class="actions">
            <a class="btn" href="./start.html">回到入口</a>
            <a class="btn" href="../0514原型/preview-all.html" target="_blank" rel="noreferrer">原型全览</a>
          </div>
        </div>
        <div class="content">
          <div class="canvas">
            <div class="split">
              <section class="pane">
                <h1 class="h1">页面</h1>
                <p class="p">左侧选择页面，右侧 iframe 预览实现版页面。</p>
                <div class="pages" id="pages"></div>
              </section>
              <section class="pane">
                <h1 class="h1" id="cur">（未选择）</h1>
                <p class="p" id="path"></p>
                <div class="card frame-wrap" style="padding:0;overflow:hidden">
                  <iframe id="frame" title="preview"></iframe>
                </div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const PAGES = [
        { name: "Start", file: "start.html" },
        { name: "新对话", file: "新对话.html" },
        { name: "自动化", file: "自动化.html" },
        { name: "扩展", file: "扩展.html" },
        { name: "插件", file: "插件.html" },
        { name: "技能", file: "技能.html" },
        { name: "MCP服务器", file: "mcp服务器.html" },
        { name: "设置", file: "设置.html" },
        { name: "计费与订阅", file: "计费与订阅.html" },
      ];

      const els = {
        pages: document.getElementById("pages"),
        frame: document.getElementById("frame"),
        cur: document.getElementById("cur"),
        path: document.getElementById("path"),
      };

      function getHashPage(){
        const m = location.hash.match(/page=([^&]+)/);
        return m ? decodeURIComponent(m[1]) : "";
      }
      function setHashPage(file){
        location.hash = `page=${encodeURIComponent(file)}`;
      }
      function select(file){
        const p = PAGES.find(x => x.file === file) || { name: file, file };
        els.cur.textContent = p.name;
        els.path.textContent = p.file;
        els.frame.src = p.file;
        [...els.pages.querySelectorAll("button")].forEach(b => {
          b.dataset.active = b.dataset.file === file ? "1" : "0";
          b.style.borderColor = b.dataset.active === "1" ? "rgba(122,168,255,.55)" : "rgba(255,255,255,.12)";
          b.style.background = b.dataset.active === "1" ? "rgba(122,168,255,.10)" : "rgba(0,0,0,.25)";
        });
      }

      for (const p of PAGES){
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.dataset.file = p.file;
        btn.textContent = p.name;
        btn.addEventListener("click", () => setHashPage(p.file));
        els.pages.appendChild(btn);
      }

      window.addEventListener("hashchange", () => select(getHashPage() || "start.html"));
      select(getHashPage() || "start.html");
      setHashPage(getHashPage() || "start.html");
    </script>
  </body>
</html>
