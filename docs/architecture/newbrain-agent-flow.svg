<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" role="img" aria-labelledby="title desc">
  <title id="title">NewBrain Agent 主路径</title>
  <desc id="desc">从 Composer 提交经过 IPC、主进程和 AgentLoop，到完成、审批、取消或失败。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#1c2430"/>
    </marker>
  </defs>
  <style>
    .title { font: 600 22px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
    .legend { font: 400 13px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
    .h { font: 600 16px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
    .s { font: 400 13px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
    .hs { font: 600 15px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17202a; }
    .ss { font: 400 12px "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
    .n { font: 600 12px "Segoe UI", sans-serif; fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1c2430; stroke-width: 1.5; }
    .memory { fill: #e8f2fc; stroke: #1a5fad; stroke-width: 1.5; }
    .ok { fill: #e7f6ec; stroke: #187944; stroke-width: 1.5; }
    .bad { fill: #fdeeee; stroke: #b42318; stroke-width: 1.5; }
    .line { fill: none; stroke: #1c2430; stroke-width: 1.5; }
  </style>
  <text class="title" x="36" y="42">Agent 主路径</text>
  <circle cx="390" cy="36" r="6" fill="#1a5fad"/>
  <text class="legend" x="404" y="41">记忆</text>
  <circle cx="470" cy="36" r="6" fill="#187944"/>
  <text class="legend" x="484" y="41">完成</text>
  <circle cx="550" cy="36" r="6" fill="#b42318"/>
  <text class="legend" x="564" y="41">失败</text>
  <g>
    <rect class="box" x="210" y="68" width="380" height="72" rx="10"/>
    <circle cx="242" cy="104" r="12" fill="#1c2430"/>
    <text class="n" x="242" y="108" text-anchor="middle">1</text>
    <text class="h" x="424" y="97" text-anchor="middle">用户提交</text>
    <text class="s" x="424" y="120" text-anchor="middle">Composer 发送</text>
  </g>
  <path class="line" d="M400 140 V176" marker-end="url(#arrow)"/>
  <g>
    <rect class="box" x="210" y="180" width="380" height="72" rx="10"/>
    <circle cx="242" cy="216" r="12" fill="#1c2430"/>
    <text class="n" x="242" y="220" text-anchor="middle">2</text>
    <text class="h" x="424" y="209" text-anchor="middle">进入主进程</text>
    <text class="s" x="424" y="232" text-anchor="middle">model.chat IPC</text>
  </g>
  <path class="line" d="M400 252 V288" marker-end="url(#arrow)"/>
  <g>
    <rect class="memory" x="210" y="292" width="380" height="72" rx="10"/>
    <circle cx="242" cy="328" r="12" fill="#1a5fad"/>
    <text class="n" x="242" y="332" text-anchor="middle">3</text>
    <text class="h" x="424" y="321" text-anchor="middle">组装上下文</text>
    <text class="s" x="424" y="344" text-anchor="middle">hydrate 并召回记忆</text>
  </g>
  <path class="line" d="M400 364 V400" marker-end="url(#arrow)"/>
  <g>
    <rect class="memory" x="210" y="404" width="380" height="72" rx="10"/>
    <circle cx="242" cy="440" r="12" fill="#1a5fad"/>
    <text class="n" x="242" y="444" text-anchor="middle">4</text>
    <text class="h" x="424" y="433" text-anchor="middle">模型与工具循环</text>
    <text class="s" x="424" y="456" text-anchor="middle">AgentLoop 授权决策</text>
  </g>
  <path class="line" d="M400 476 V512 H115 V548" marker-end="url(#arrow)"/>
  <path class="line" d="M400 512 H305 V548" marker-end="url(#arrow)"/>
  <path class="line" d="M400 512 H495 V548" marker-end="url(#arrow)"/>
  <path class="line" d="M400 512 H685 V548" marker-end="url(#arrow)"/>
  <g>
    <rect class="ok" x="30" y="556" width="170" height="80" rx="10"/>
    <text class="hs" x="115" y="588" text-anchor="middle">完成</text>
    <text class="ss" x="115" y="610" text-anchor="middle">写入本轮记忆</text>
  </g>
  <g>
    <rect class="box" x="220" y="556" width="170" height="80" rx="10"/>
    <text class="hs" x="305" y="588" text-anchor="middle">等待审批</text>
    <text class="ss" x="305" y="610" text-anchor="middle">暂不写入记忆</text>
  </g>
  <g>
    <rect class="box" x="410" y="556" width="170" height="80" rx="10"/>
    <text class="hs" x="495" y="588" text-anchor="middle">用户取消</text>
    <text class="ss" x="495" y="610" text-anchor="middle">停止当前循环</text>
  </g>
  <g>
    <rect class="bad" x="600" y="556" width="170" height="80" rx="10"/>
    <text class="hs" x="685" y="588" text-anchor="middle">运行失败</text>
    <text class="ss" x="685" y="610" text-anchor="middle">失败状态落盘</text>
  </g>
</svg>
