name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "platforms/windows/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-core-release.json"
      - "newbrain.bootstrap.json"
      - "newbrain.config.json"
      - "newbrain.features.json"
      - "newbrain.workspaces.json"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NEWBRAIN_ALLOW_UNSIGNED: "true"
      NEWBRAIN_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platforms/windows/pnpm-lock.yaml
      - name: Materialize Windows workspace
        run: node scripts/materialize.mjs windows
      - name: Install dependencies
        working-directory: .materialized/windows
        run: pnpm install --frozen-lockfile
      - name: Package unsigned production installer
        working-directory: .materialized/windows
        run: pnpm run package:win-msi:production
      - uses: actions/upload-artifact@v4
        with:
          name: newbrian-windows-x64
          if-no-files-found: error
          path: |
            .materialized/windows/apps/desktop/release/production/*.msi
            .materialized/windows/apps/desktop/release/production/*setup*.exe
